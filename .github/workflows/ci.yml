name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Fetch echo-sync (binary + licence, checksum-verified)
        run: npm run sidecar
      - run: npm run check
      - run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
