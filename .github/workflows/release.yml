name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The installers take their version from the files, the release page from the tag; refuse to build if they differ.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-version.mjs "${{ github.ref_name }}"

  # One job makes the draft release and every build uploads into it by id. If each matrix leg
  # let tauri-action find-or-create the release, legs starting together could each create one.
  create-release:
    needs: check-version
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Find or create the draft release for the tag
        id: release
        run: |
          # A re-run reuses the release this tag already has (draft or not).
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .id' | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="HeckTunes $TAG" \
              -f body="Unsigned builds. See the README for how to open them on Windows and macOS." \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "Release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      # Baked into the app at build time; both are optional.
      HECKTUNES_ACOUSTID_KEY: ${{ secrets.HECKTUNES_ACOUSTID_KEY }}
      HECKTUNES_CONTACT: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Fetch echo-sync for the target (binary + licence, checksum-verified)
        run: node scripts/fetch-echo-sync.mjs --target ${{ matrix.target }}
      # The AAC-only ffmpeg sidecar (and its licence), rebuilt only when the build script changes.
      - name: Cache the ffmpeg sidecar
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries/ffmpeg-${{ matrix.target }}*
            src-tauri/licenses/ffmpeg-LICENSE.txt
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: CLANG64
          install: make diffutils curl xz mingw-w64-clang-x86_64-clang
      - name: Build the ffmpeg sidecar (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh ${{ matrix.target }}
      - name: Build the ffmpeg sidecar (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh ${{ matrix.target }}
      - name: Third-party notices for the target
        run: node scripts/third-party-notices.mjs --target ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          tagName: ${{ github.ref_name }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  # echo-sync (GPLv3) and the ffmpeg sidecar (LGPL) ship inside the installers, so their source
  # goes on the same release page.
  echo-sync-source:
    needs: [create-release, build]
    # Runs even if one matrix leg failed. Skipped when no release was made (e.g. the version
    # check failed), since nothing was built.
    if: always() && !cancelled() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Attach echo-sync's and ffmpeg's source to the draft release
        run: |
          # Replace an earlier upload (a re-run), then upload into the release by id.
          upload() { # <file> <content type>
            old=$(FILE="$1" gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[] | select(.name == env.FILE) | .id')
            if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$1" \
              -H "Content-Type: $2" --input "$1" --jq '"Uploaded \(.name) (\(.size) bytes)"'
          }
          curl -fsSL --retry 3 -o echopod-v0.11.1-source.tar.gz https://github.com/BasilSkyWalk/echopod/archive/refs/tags/v0.11.1.tar.gz
          upload echopod-v0.11.1-source.tar.gz application/gzip
          # The exact tarball the ffmpeg sidecar is built from, checked against its pinned SHA-256.
          version=$(sed -n 's/^VERSION=//p' scripts/build-ffmpeg.sh)
          sha=$(sed -n 's/^SHA256=//p' scripts/build-ffmpeg.sh)
          file="ffmpeg-$version.tar.xz"
          curl -fsSL --retry 3 -o "$file" "https://ffmpeg.org/releases/$file"
          echo "$sha  $file" | sha256sum -c -
          upload "$file" application/x-xz
