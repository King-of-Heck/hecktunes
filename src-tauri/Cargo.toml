[package]
name = "hecktunes"
version = "0.3.0"
description = "Music library and Echo Mini sync"
authors = ["HeckTunes contributors"]
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hecktunes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
blake3 = "1.8"
rusqlite = { version = "0.41", features = ["bundled"] }
lofty = "0.25"
flacenc = "0.5"
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
rusty-chromaprint = "0.3"
hound = "3.5"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.23"
strsim = "0.11"
unicode-normalization = "0.1"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }

[dev-dependencies]
tempfile = "3"
